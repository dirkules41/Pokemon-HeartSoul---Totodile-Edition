name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            git \
            libpng-dev \
            perl

      - name: Build (modern)
        run: |
          # Build using the system arm toolchain (MODERN=1)
          make -j$(nproc) MODERN=1 CFLAGS="-Wno-error=dangling-else"

      - name: List build outputs
        run: ls -la

      - name: Upload ROM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-rom
          path: |
            *.gba
          retention-days: 90

      - name: Verify ROM checksum
        run: make compare
        continue-on-error: true
